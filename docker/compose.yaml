name: asta-it-operations-lab

services:
  web:
    image: nginx:1.28.3-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
